<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg: #14161a;
    --surface: #1d2026;
    --surface-2: #24272e;
    --surface-3: #2b2f37;
    --border: #2f333c;
    --text: #e9e7e1;
    --text-dim: #9a9ea8;
    --accent: #e8a33d;
    --danger: #e2665a;
    --radius: 10px;
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a{ color: inherit; }
  button{ font-family: inherit; }

  /* ---------- Header ---------- */
  header{
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .header-top{
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
  }
  .header-top h1{
    font-size: 18px; font-weight: 650; margin: 0; letter-spacing: -0.01em; flex-shrink: 0;
  }
  .header-top h1 span{ color: var(--accent); }
  .icon-btn{
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; cursor: pointer;
  }
  .icon-btn:active{ transform: scale(0.94); }

  #chips{
    flex: 1; min-width: 0; display: flex; gap: 8px; overflow-x: auto;
    scrollbar-width: none; padding: 2px 0;
  }
  #chips::-webkit-scrollbar{ display: none; }
  .chip{
    flex-shrink: 0; background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 550; cursor: pointer;
    white-space: nowrap;
  }
  .chip.active{ background: var(--text); color: #14161a; border-color: var(--text); }

  /* ---------- Layout: sidebar + main ---------- */
  #body-layout{ display: flex; align-items: flex-start; }

  #overlay{
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 25;
  }
  #overlay.open{ opacity: 1; pointer-events: auto; }

  #sidebar{
    position: fixed; top: 0; left: 0; bottom: 0; width: 250px; z-index: 30;
    background: var(--surface); border-right: 1px solid var(--border);
    transform: translateX(-100%); transition: transform 0.2s;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #sidebar.open{ transform: translateX(0); }
  .sidebar-toggle-row{ padding: 14px 16px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .switch-label{ display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; cursor: pointer; }
  .switch{ position: relative; display: inline-block; width: 38px; height: 22px; flex-shrink: 0; }
  .switch input{ opacity: 0; width: 0; height: 0; }
  .switch-slider{ position: absolute; inset: 0; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; transition: 0.2s; }
  .switch-slider:before{ content: ""; position: absolute; height: 16px; width: 16px; left: 2px; top: 2px; background: var(--text-dim); border-radius: 50%; transition: 0.2s; }
  .switch input:checked + .switch-slider{ background: var(--accent); border-color: var(--accent); }
  .switch input:checked + .switch-slider:before{ background: #1a1200; transform: translateX(16px); }

  .sidebar-header{
    padding: 16px 16px 10px; font-size: 13px; font-weight: 650; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.04em; flex-shrink: 0;
  }
  #sidebar-list{ overflow-y: auto; padding: 4px 8px 16px; flex: 1; min-height: 0; }
  .side-chan-row{
    display: flex; align-items: center; gap: 4px; border-radius: 8px;
  }
  .side-chan-row:hover, .side-chan-row:active{ background: var(--surface-2); }
  .side-chan{
    display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px;
    text-decoration: none; font-size: 14px; flex: 1; min-width: 0;
  }
  .side-chan img{ width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; background: var(--surface-2); }
  .side-chan span{ overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-chan-row.hidden-chan{ opacity: 0.45; }
  .side-hide-btn{
    background: none; border: none; color: var(--text-dim); font-size: 15px; cursor: pointer;
    padding: 6px; flex-shrink: 0; border-radius: 6px;
  }
  .side-hide-btn:active{ background: var(--surface-3); }

  #main{ flex: 1; min-width: 0; max-width: 1400px; margin: 0 auto; }

  @media (min-width: 900px){
    #menu-btn{ display: none; }
    #overlay{ display: none; }
    #sidebar{
      position: sticky; top: 57px; transform: none; height: calc(100vh - 57px);
      border-right: 1px solid var(--border);
    }
  }

  /* ---------- Settings panel ---------- */
  #panel{
    margin: 16px; padding: 14px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
    display: none;
  }
  #panel.open{ display: block; }
  #panel label{ font-size: 12px; color: var(--text-dim); display: block; margin: 10px 0 4px; }
  #panel label:first-child{ margin-top: 0; }
  #panel input{
    width: 100%; background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 9px 10px; font-size: 14px;
  }
  #panel .row{ display: flex; gap: 8px; }
  #panel .row input{ flex: 1; }
  #panel button.primary{
    background: var(--accent); color: #1a1200; border: none; font-weight: 600;
    border-radius: 8px; padding: 9px 14px; font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  #panel button.primary:disabled{ opacity: 0.5; }
  #panel button.primary.wide{ width: 100%; margin-top: 8px; }
  #panel button.primary.wide:disabled{ opacity: 0.5; }
  #panel small{ color: var(--text-dim); font-size: 12px; line-height: 1.5; display: block; margin-top: 6px; }
  #panel small a{ color: var(--accent); }
  #panel hr{ border: none; border-top: 1px solid var(--border); margin: 16px 0; }

  #chan-list{ margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .chan-row{
    display: flex; align-items: center; gap: 8px; font-size: 13px;
    background: var(--surface-2); border-radius: 8px; padding: 6px 8px;
  }
  .chan-row img{ width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; }
  .chan-row span{ flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chan-row button{
    background: none; border: none; color: var(--danger); font-size: 13px; cursor: pointer; padding: 2px 4px;
  }

  #status{ padding: 4px 16px 4px; font-size: 12px; color: var(--text-dim); min-height: 16px; }

  /* ---------- Video grid ---------- */
  #feed{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 28px 16px;
    padding: 12px 16px 32px;
  }
  .video-card{ display: flex; flex-direction: column; min-width: 0; position: relative; }
  .thumb-link{ display: block; position: relative; border-radius: 12px; overflow: hidden; background: var(--surface-2); aspect-ratio: 16/9; }
  .thumb-link img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  .short-badge{
    position: absolute; left: 8px; bottom: 8px; z-index: 2;
    background: rgba(20,22,26,0.9); color: var(--accent); font-size: 13px; font-weight: 700;
    padding: 5px 11px; border-radius: 8px; letter-spacing: 0.02em;
    border: 2px solid var(--accent);
  }
  .video-info{ display: flex; gap: 10px; margin-top: 10px; }
  .avatar-link{ flex-shrink: 0; }
  .avatar-link img{ width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); object-fit: cover; }
  .video-text{ min-width: 0; display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .v-title{
    font-size: 15px; line-height: 1.35; font-weight: 500; text-decoration: none;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .v-channel{ font-size: 12.5px; color: var(--text-dim); text-decoration: none; }
  .v-channel:active{ color: var(--text); }
  .v-meta{ font-size: 12.5px; color: var(--text-dim); }
  .kebab-btn{
    background: none; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer;
    padding: 4px 6px; flex-shrink: 0; align-self: flex-start; border-radius: 6px;
  }
  .kebab-btn:active{ background: var(--surface-2); }
  .card-menu{
    display: none; position: absolute; right: 8px; top: 44px; z-index: 5;
    background: var(--surface-3); border: 1px solid var(--border); border-radius: 8px;
    padding: 4px; box-shadow: 0 4px 16px rgba(0,0,0,0.4); min-width: 190px;
  }
  .card-menu.open{ display: block; }
  .card-menu button{
    display: block; width: 100%; text-align: left; background: none; border: none; color: var(--text);
    font-size: 13px; padding: 8px 10px; border-radius: 6px; cursor: pointer;
  }
  .card-menu button:active{ background: var(--surface-2); }

  /* ---------- Skeletons ---------- */
  .skeleton .thumb-link{ background: var(--surface-2); }
  .skeleton-block{
    background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 37%, var(--surface-2) 63%);
    background-size: 400% 100%; animation: shimmer 1.4s ease infinite; border-radius: 6px;
  }
  .skeleton .avatar-link img{ visibility: hidden; }
  .skeleton .avatar-link{ width: 36px; height: 36px; border-radius: 50%; }
  .skeleton .sk-title{ height: 14px; width: 90%; margin-bottom: 6px; }
  .skeleton .sk-title.short{ width: 60%; margin-bottom: 8px; }
  .skeleton .sk-meta{ height: 11px; width: 40%; }
  @keyframes shimmer{ 0%{ background-position: 100% 0; } 100%{ background-position: 0 0; } }

  #empty{ padding: 40px 24px; text-align: center; color: var(--text-dim); font-size: 14px; line-height: 1.6; }
  #empty button{
    margin-top: 14px; background: var(--accent); color: #1a1200; border: none; font-weight: 600;
    border-radius: 8px; padding: 10px 16px; font-size: 14px; cursor: pointer;
  }

  .spinner{
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.7s linear infinite; display: inline-block; vertical-align: -3px; margin-right: 6px;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
</style>

<header>
  <div class="header-top">
    <button class="icon-btn" id="menu-btn" aria-label="Abonnements">☰</button>
    <h1>Flux<span>.</span></h1>
    <div id="chips"></div>
    <button class="icon-btn" id="settings-btn" aria-label="Réglages">⚙</button>
  </div>
</header>

<div id="body-layout">
  <div id="overlay"></div>
  <aside id="sidebar">
    <div class="sidebar-toggle-row">
      <label class="switch-label">
        <span>Masquer les Shorts</span>
        <span class="switch"><input type="checkbox" id="hide-shorts-toggle"><span class="switch-slider"></span></span>
      </label>
    </div>
    <div class="sidebar-header">Abonnements</div>
    <div id="sidebar-list"></div>
  </aside>

  <main id="main">
    <div id="panel">
      <label for="api-key">Clé API YouTube</label>
      <input id="api-key" type="text" placeholder="AIza..." autocomplete="off" autocapitalize="off" spellcheck="false">

      <label for="client-id">ID client OAuth Google</label>
      <input id="client-id" type="text" placeholder="xxxxx.apps.googleusercontent.com" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="primary wide" id="import-btn">Importer mes abonnements</button>
      <small id="import-msg"></small>

      <hr>

      <label for="chan-input">Ou ajoute une chaîne manuellement (handle, URL ou ID)</label>
      <div class="row">
        <input id="chan-input" type="text" placeholder="@nomdelachaine" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="primary" id="add-chan-btn">Ajouter</button>
      </div>
      <small id="panel-msg"></small>

      <div id="chan-list"></div>
    </div>

    <div id="status"></div>
    <div id="feed"></div>
    <div id="empty" style="display:none;">
      Aucune chaîne ajoutée pour l'instant.<br>
      Ouvre les réglages, colle ta clé API, puis importe tes abonnements ou ajoute des chaînes une par une.
      <div><button id="empty-settings-btn">Ouvrir les réglages</button></div>
    </div>
  </main>
</div>

<script>
(function(){
  const STORAGE_KEY = 'yt-config';
  let config = { apiKey: '', clientId: '', channels: [], hiddenChannelIds: [], hideShorts: false };
  let allVideos = [];               // vidéos réelles déjà chargées (hors Shorts), triées par date
  let pendingChannelIds = new Set(); // chaînes dont le chargement n'est pas terminé
  let channelLastPublished = {};     // channelId -> date de la vidéo la plus récente connue
  let categoriesMap = {};            // categoryId -> nom lisible
  let categoriesLoaded = false;
  let activeCategory = 'all';

  const menuBtn = document.getElementById('menu-btn');
  const hideShortsToggle = document.getElementById('hide-shorts-toggle');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const sidebarList = document.getElementById('sidebar-list');
  const chipsEl = document.getElementById('chips');

  const panel = document.getElementById('panel');
  const settingsBtn = document.getElementById('settings-btn');
  const emptySettingsBtn = document.getElementById('empty-settings-btn');
  const apiKeyInput = document.getElementById('api-key');
  const clientIdInput = document.getElementById('client-id');
  const importBtn = document.getElementById('import-btn');
  const importMsg = document.getElementById('import-msg');
  const chanInput = document.getElementById('chan-input');
  const addChanBtn = document.getElementById('add-chan-btn');
  const chanList = document.getElementById('chan-list');
  const panelMsg = document.getElementById('panel-msg');
  const statusEl = document.getElementById('status');
  const feedEl = document.getElementById('feed');
  const emptyEl = document.getElementById('empty');

  function togglePanel(force){
    const open = force !== undefined ? force : !panel.classList.contains('open');
    panel.classList.toggle('open', open);
  }
  settingsBtn.addEventListener('click', () => togglePanel());
  emptySettingsBtn.addEventListener('click', () => togglePanel(true));

  function openSidebar(force){
    const open = force !== undefined ? force : !sidebar.classList.contains('open');
    sidebar.classList.toggle('open', open);
    overlay.classList.toggle('open', open);
  }
  menuBtn.addEventListener('click', () => openSidebar());
  overlay.addEventListener('click', () => openSidebar(false));

  function channelUrl(id){ return `https://www.youtube.com/channel/${id}/videos`; }
  function isHidden(id){ return config.hiddenChannelIds.includes(id); }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  async function loadConfig(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        config = Object.assign({ apiKey:'', clientId:'', channels:[], hiddenChannelIds:[], hideShorts:false }, parsed);
      }
    }catch(e){ /* pas de config sauvegardée, ou stockage indisponible — ok */ }
    apiKeyInput.value = config.apiKey || '';
    clientIdInput.value = config.clientId || '';
    hideShortsToggle.checked = !!config.hideShorts;
    renderChanList();
    renderSidebar();
  }

  async function saveConfig(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(config)); }
    catch(e){ console.error('Erreur de stockage', e); }
  }

  apiKeyInput.addEventListener('input', () => { config.apiKey = apiKeyInput.value.trim(); saveConfig(); });
  clientIdInput.addEventListener('input', () => { config.clientId = clientIdInput.value.trim(); saveConfig(); });

  hideShortsToggle.addEventListener('change', () => {
    config.hideShorts = hideShortsToggle.checked;
    saveConfig();
    applyFilterAndRender();
  });

  function renderChanList(){
    chanList.innerHTML = '';
    config.channels.forEach(ch => {
      const row = document.createElement('div');
      row.className = 'chan-row';
      row.innerHTML = `<img src="${ch.thumb || ''}" alt=""><span>${escapeHtml(ch.title)}</span>`;
      const rm = document.createElement('button');
      rm.textContent = 'retirer';
      rm.addEventListener('click', () => {
        config.channels = config.channels.filter(c => c.id !== ch.id);
        config.hiddenChannelIds = config.hiddenChannelIds.filter(id => id !== ch.id);
        saveConfig();
        renderChanList();
        renderSidebar();
        applyFilterAndRender();
      });
      row.appendChild(rm);
      chanList.appendChild(row);
    });
  }

  function toggleHidden(channelId){
    if(isHidden(channelId)){
      config.hiddenChannelIds = config.hiddenChannelIds.filter(id => id !== channelId);
    } else {
      config.hiddenChannelIds.push(channelId);
    }
    saveConfig();
    renderSidebar();
    applyFilterAndRender();
  }

  function renderSidebar(){
    sidebarList.innerHTML = '';
    const sorted = [...config.channels].sort((a,b) => {
      const da = channelLastPublished[a.id] ? new Date(channelLastPublished[a.id]).getTime() : 0;
      const db = channelLastPublished[b.id] ? new Date(channelLastPublished[b.id]).getTime() : 0;
      return db - da;
    });
    sorted.forEach(ch => {
      const row = document.createElement('div');
      row.className = 'side-chan-row' + (isHidden(ch.id) ? ' hidden-chan' : '');

      const a = document.createElement('a');
      a.className = 'side-chan';
      a.href = channelUrl(ch.id);
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML = `<img src="${ch.thumb || ''}" alt=""><span>${escapeHtml(ch.title)}</span>`;
      a.addEventListener('click', () => openSidebar(false));

      const hideBtn = document.createElement('button');
      hideBtn.className = 'side-hide-btn';
      hideBtn.title = isHidden(ch.id) ? 'Afficher cette chaîne' : 'Masquer cette chaîne';
      hideBtn.textContent = isHidden(ch.id) ? '🚫' : '👁';
      hideBtn.addEventListener('click', () => toggleHidden(ch.id));

      row.appendChild(a);
      row.appendChild(hideBtn);
      sidebarList.appendChild(row);
    });
  }

  function extractHandleOrId(raw){
    let s = raw.trim();
    s = s.replace(/^https?:\/\/(www\.)?youtube\.com\//i, '');
    s = s.replace(/\/.*$/, '');
    if(s.startsWith('@')) return { type: 'handle', value: s };
    if(/^UC[a-zA-Z0-9_-]{22}$/.test(s)) return { type: 'id', value: s };
    if(!s.startsWith('@')) return { type: 'handle', value: '@' + s.replace(/^channel\//,'') };
    return { type: 'handle', value: s };
  }

  async function resolveChannel(raw){
    const key = config.apiKey;
    if(!key) throw new Error('Ajoute d\'abord ta clé API.');
    const parsed = extractHandleOrId(raw);
    let url;
    if(parsed.type === 'id'){
      url = `https://www.googleapis.com/youtube/v3/channels?part=snippet&id=${encodeURIComponent(parsed.value)}&key=${key}`;
    } else {
      url = `https://www.googleapis.com/youtube/v3/channels?part=snippet&forHandle=${encodeURIComponent(parsed.value)}&key=${key}`;
    }
    const res = await fetch(url);
    const data = await res.json();
    if(!res.ok) throw new Error(data?.error?.message || 'Chaîne introuvable.');
    const item = data.items && data.items[0];
    if(!item) throw new Error('Chaîne introuvable — vérifie le handle ou l\'ID.');
    return { id: item.id, title: item.snippet.title, thumb: item.snippet.thumbnails?.default?.url || '' };
  }

  addChanBtn.addEventListener('click', async () => {
    const raw = chanInput.value.trim();
    if(!raw) return;
    panelMsg.textContent = 'Recherche…';
    addChanBtn.disabled = true;
    try{
      const ch = await resolveChannel(raw);
      if(config.channels.some(c => c.id === ch.id)){
        panelMsg.textContent = 'Déjà dans la liste.';
      } else {
        config.channels.push(ch);
        await saveConfig();
        renderChanList();
        renderSidebar();
        panelMsg.textContent = `Ajoutée : ${ch.title}`;
        chanInput.value = '';
        loadChannel(ch);
      }
    }catch(e){
      panelMsg.textContent = e.message;
    }finally{
      addChanBtn.disabled = false;
    }
  });

  chanInput.addEventListener('keydown', e => { if(e.key === 'Enter') addChanBtn.click(); });

  function waitForGis(timeoutMs){
    return new Promise((resolve, reject) => {
      const start = Date.now();
      (function check(){
        if(window.google && window.google.accounts && window.google.accounts.oauth2) resolve();
        else if(Date.now() - start > timeoutMs) reject(new Error('La librairie Google ne s\'est pas chargée. Vérifie ta connexion et réessaie.'));
        else setTimeout(check, 150);
      })();
    });
  }

  function requestAccessToken(clientId){
    return new Promise((resolve, reject) => {
      try{
        const tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: clientId,
          scope: 'https://www.googleapis.com/auth/youtube.readonly',
          callback: (resp) => { if(resp.error) reject(new Error(resp.error_description || resp.error)); else resolve(resp.access_token); },
          error_callback: (err) => reject(new Error(err?.message || 'Connexion Google annulée ou refusée.'))
        });
        tokenClient.requestAccessToken({ prompt: '' });
      }catch(e){ reject(e); }
    });
  }

  async function fetchAllSubscriptions(token){
    let subs = []; let pageToken = '';
    do{
      const url = `https://www.googleapis.com/youtube/v3/subscriptions?part=snippet&mine=true&maxResults=50&order=alphabetical${pageToken ? '&pageToken=' + pageToken : ''}`;
      const res = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
      const data = await res.json();
      if(!res.ok) throw new Error(data?.error?.message || 'Échec de récupération des abonnements.');
      subs = subs.concat(data.items || []);
      pageToken = data.nextPageToken || '';
    } while(pageToken);
    return subs.map(it => ({ id: it.snippet.resourceId.channelId, title: it.snippet.title, thumb: it.snippet.thumbnails?.default?.url || '' }));
  }

  importBtn.addEventListener('click', async () => {
    const clientId = clientIdInput.value.trim();
    if(!clientId){ importMsg.textContent = 'Colle d\'abord ton ID client OAuth Google.'; return; }
    config.clientId = clientId; saveConfig();
    importBtn.disabled = true;
    importMsg.innerHTML = '<span class="spinner"></span> Connexion à Google…';
    try{
      await waitForGis(8000);
      const token = await requestAccessToken(clientId);
      importMsg.innerHTML = '<span class="spinner"></span> Récupération de tes abonnements…';
      const subs = await fetchAllSubscriptions(token);
      const newOnes = [];
      subs.forEach(ch => {
        if(!config.channels.some(c => c.id === ch.id)){ config.channels.push(ch); newOnes.push(ch); }
      });
      await saveConfig();
      renderChanList();
      renderSidebar();
      importMsg.textContent = `${subs.length} abonnements trouvés, ${newOnes.length} nouvelle(s) chaîne(s) ajoutée(s).`;
      refreshFeed();
    }catch(e){
      importMsg.textContent = 'Erreur : ' + e.message;
    }finally{
      importBtn.disabled = false;
    }
  });

  function isVerticalThumbnail(thumbnails){
    const order = ['maxres', 'standard', 'high', 'medium', 'default'];
    for(const key of order){
      const t = thumbnails?.[key];
      if(t && t.width && t.height) return t.height > t.width;
    }
    return false;
  }

  function parseDurationSeconds(iso){
    const m = /^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(iso || '');
    if(!m) return 0;
    return parseInt(m[1]||'0',10)*3600 + parseInt(m[2]||'0',10)*60 + parseInt(m[3]||'0',10);
  }

  function timeAgo(iso){
    const diff = (Date.now() - new Date(iso).getTime()) / 1000;
    const units = [[31536000,'an'],[2592000,'mois'],[86400,'j'],[3600,'h'],[60,'min']];
    for(const [secs, label] of units){
      if(diff >= secs){
        const n = Math.floor(diff / secs);
        return `il y a ${n} ${label}${label!=='mois' && label!=='h' && label!=='min' && n>1 ? 's':''}`;
      }
    }
    return 'à l\'instant';
  }

  function formatViews(n){
    if(n === undefined || n === null) return '';
    try{ return new Intl.NumberFormat('fr-FR', { notation: 'compact', compactDisplay: 'short' }).format(n) + ' vues'; }
    catch(e){ return n + ' vues'; }
  }

  async function ensureCategories(){
    if(categoriesLoaded || !config.apiKey) return;
    try{
      const url = `https://www.googleapis.com/youtube/v3/videoCategories?part=snippet&regionCode=FR&hl=fr&key=${config.apiKey}`;
      const res = await fetch(url);
      const data = await res.json();
      if(res.ok){
        (data.items || []).forEach(it => { categoriesMap[it.id] = it.snippet.title; });
        categoriesLoaded = true;
      }
    }catch(e){ /* tant pis, les vidéos resteront sans catégorie affichée */ }
  }

  function renderChips(){
    const counts = {};
    allVideos.forEach(v => {
      if(isHidden(v.channelId) || !v.categoryId) return;
      if(config.hideShorts && v.isShort) return;
      counts[v.categoryId] = (counts[v.categoryId] || 0) + 1;
    });
    const cats = Object.keys(counts).sort((a,b) => counts[b]-counts[a]);
    chipsEl.innerHTML = '';
    const makeChip = (id, label) => {
      const b = document.createElement('button');
      b.className = 'chip' + (activeCategory === id ? ' active' : '');
      b.textContent = label;
      b.addEventListener('click', () => { activeCategory = id; renderChips(); applyFilterAndRender(); });
      return b;
    };
    chipsEl.appendChild(makeChip('all', 'Tous'));
    cats.forEach(id => chipsEl.appendChild(makeChip(id, categoriesMap[id] || 'Autre')));
  }

  function skeletonCard(){
    const card = document.createElement('div');
    card.className = 'video-card skeleton';
    card.innerHTML = `
      <div class="thumb-link"></div>
      <div class="video-info">
        <div class="avatar-link"><div class="skeleton-block" style="width:36px;height:36px;border-radius:50%;"></div></div>
        <div class="video-text">
          <div class="skeleton-block sk-title"></div>
          <div class="skeleton-block sk-title short"></div>
          <div class="skeleton-block sk-meta"></div>
        </div>
      </div>`;
    return card;
  }

  document.addEventListener('click', (e) => {
    if(!e.target.closest('.kebab-btn') && !e.target.closest('.card-menu')){
      document.querySelectorAll('.card-menu.open').forEach(m => m.classList.remove('open'));
    }
  });

  function videoCard(v){
    const card = document.createElement('div');
    card.className = 'video-card';
    card.innerHTML = `
      <a class="thumb-link" href="https://www.youtube.com/watch?v=${v.videoId}" target="_blank" rel="noopener">
        <img src="${v.thumb}" alt="" loading="lazy">
        ${v.isShort ? '<span class="short-badge">Short</span>' : ''}
      </a>
      <div class="video-info">
        <a class="avatar-link" href="${channelUrl(v.channelId)}" target="_blank" rel="noopener">
          <img src="${v.channelThumb || ''}" alt="">
        </a>
        <div class="video-text">
          <a class="v-title" href="https://www.youtube.com/watch?v=${v.videoId}" target="_blank" rel="noopener">${escapeHtml(v.title)}</a>
          <a class="v-channel" href="${channelUrl(v.channelId)}" target="_blank" rel="noopener">${escapeHtml(v.channelTitle)}</a>
          <div class="v-meta">${formatViews(v.views)} · ${timeAgo(v.publishedAt)}</div>
        </div>
        <button class="kebab-btn">⋮</button>
        <div class="card-menu">
          <button class="hide-action">${isHidden(v.channelId) ? 'Afficher cette chaîne' : 'Masquer cette chaîne'}</button>
        </div>
      </div>`;
    const kebab = card.querySelector('.kebab-btn');
    const menu = card.querySelector('.card-menu');
    kebab.addEventListener('click', (e) => {
      e.stopPropagation();
      document.querySelectorAll('.card-menu.open').forEach(m => { if(m !== menu) m.classList.remove('open'); });
      menu.classList.toggle('open');
    });
    card.querySelector('.hide-action').addEventListener('click', () => { toggleHidden(v.channelId); menu.classList.remove('open'); });
    return card;
  }

  function applyFilterAndRender(){
    renderChips();
    feedEl.innerHTML = '';
    const visible = allVideos.filter(v => !isHidden(v.channelId) && (activeCategory === 'all' || v.categoryId === activeCategory) && (!config.hideShorts || !v.isShort));
    visible.forEach(v => feedEl.appendChild(videoCard(v)));
    pendingChannelIds.forEach(id => { if(!isHidden(id)) feedEl.appendChild(skeletonCard()); });

    if(pendingChannelIds.size === 0){
      if(allVideos.length === 0) statusEl.textContent = 'Aucune vidéo récente (hors Shorts) trouvée.';
      else if(visible.length === 0) statusEl.textContent = 'Aucune vidéo dans cette catégorie.';
      else statusEl.textContent = `${visible.length} vidéo${visible.length>1?'s':''}`;
    }
  }

  async function fetchShortIds(channelId){
    try{
      const shortsPlaylist = 'UUSH' + channelId.slice(2);
      const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=contentDetails&playlistId=${shortsPlaylist}&maxResults=25&key=${config.apiKey}`;
      const res = await fetch(url);
      const data = await res.json();
      if(!res.ok) return new Set();
      return new Set((data.items || []).map(it => it.contentDetails.videoId));
    }catch(e){ return new Set(); }
  }

  async function fetchChannelVideos(ch){
    const key = config.apiKey;
    const uploadsPlaylist = 'UU' + ch.id.slice(2);
    const listUrl = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${uploadsPlaylist}&maxResults=5&key=${key}`;
    const listRes = await fetch(listUrl);
    const listData = await listRes.json();
    if(!listRes.ok) return [];
    const items = (listData.items || []).map(it => ({
      videoId: it.snippet.resourceId?.videoId,
      title: it.snippet.title,
      publishedAt: it.snippet.publishedAt,
      thumb: it.snippet.thumbnails?.high?.url || it.snippet.thumbnails?.medium?.url || it.snippet.thumbnails?.default?.url || '',
      channelTitle: ch.title, channelId: ch.id, channelThumb: ch.thumb
    })).filter(v => v.videoId);
    if(items.length === 0) return [];

    const ids = items.map(v => v.videoId);
    const metaUrl = `https://www.googleapis.com/youtube/v3/videos?part=snippet,contentDetails,statistics&id=${ids.join(',')}&key=${key}`;
    const [metaRes, shortIds] = await Promise.all([fetch(metaUrl), fetchShortIds(ch.id)]);
    const metaData = await metaRes.json();
    const meta = {};
    if(metaRes.ok){
      (metaData.items || []).forEach(it => {
        const duration = parseDurationSeconds(it.contentDetails.duration);
        meta[it.id] = {
          duration,
          views: it.statistics?.viewCount ? parseInt(it.statistics.viewCount, 10) : undefined,
          categoryId: it.snippet?.categoryId,
          isShort: shortIds.has(it.id) || (duration <= 180 && isVerticalThumbnail(it.snippet?.thumbnails))
        };
      });
    }
    return items.map(v => Object.assign(v, {
      views: meta[v.videoId]?.views,
      categoryId: meta[v.videoId]?.categoryId,
      isShort: meta[v.videoId]?.isShort || false
    }));
  }

  function loadChannel(ch){
    pendingChannelIds.add(ch.id);
    applyFilterAndRender();
    fetchChannelVideos(ch).then(vids => {
      allVideos = allVideos.concat(vids).sort((a,b) => new Date(b.publishedAt) - new Date(a.publishedAt));
      if(vids.length > 0) channelLastPublished[ch.id] = vids[0].publishedAt;
    }).catch(() => {}).finally(() => {
      pendingChannelIds.delete(ch.id);
      applyFilterAndRender();
      renderSidebar();
    });
  }

  async function refreshFeed(){
    if(config.channels.length === 0){ emptyEl.style.display = 'block'; feedEl.innerHTML = ''; return; }
    if(!config.apiKey){ statusEl.innerHTML = 'Ajoute ta clé API dans les réglages.'; return; }
    emptyEl.style.display = 'none';
    allVideos = [];
    pendingChannelIds = new Set(config.channels.map(c => c.id));
    statusEl.innerHTML = '<span class="spinner"></span> Chargement des dernières vidéos…';
    applyFilterAndRender();
    ensureCategories().then(() => renderChips());
    config.channels.forEach(ch => loadChannel(ch));
  }

  (async function init(){
    await loadConfig();
    if(!config.apiKey || config.channels.length === 0) togglePanel(true);
    refreshFeed();
  })();
})();
</script>
